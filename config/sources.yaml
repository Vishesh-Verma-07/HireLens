# Which public sources to sweep, and how.
# Every source here is public data. No login, no scraping behind auth.
# Google uses a search API key from .env; it is not an account login.

sources:
  hn:
    enabled: true
    # HN "Ask HN: Who is hiring?" monthly threads, via the public Algolia API.
    searchUrl: https://hn.algolia.com/api/v1/search_by_date

  funding:
    enabled: true
    # RSS feeds for funding rounds / startup news.
    feeds:
      - https://techcrunch.com/tag/funding/feed/
      - https://techcrunch.com/category/venture/feed/

  producthunt:
    enabled: true
    feeds:
      - https://www.producthunt.com/feed

  # Fresh, dated remote-job postings. These are the main source of
  # "posted in the last few days" matches.
  remoteok:
    enabled: true
    limit: 100

  remotive:
    enabled: true
    limit: 60

  # Large public board (mostly EU). Filtered to remote or India-based tech roles.
  arbeitnow:
    enabled: true
    limit: 60

  # India-focused fresher/junior roles. The listing cards include skills and a
  # relative posted date, so no detail-page fetch is needed.
  internshala:
    enabled: true
    limit: 120

  # India-focused job board with a structured public API (skills, work mode,
  # created_at). Filtered to technical full-time roles.
  unstop:
    enabled: true
    limit: 60

  yc:
    enabled: true
    url: https://www.ycombinator.com/companies
    # How many companies to pull. The run reads YC's own public search config
    # from the page, so no secret is hardcoded here.
    limit: 120
    # Only companies YC marks as actively hiring.
    hiringOnly: true
    # Optional keyword to narrow the directory, e.g. "payments".
    # query: ""

  # Google-only Board Scan. Compiles the profile into ATS-targeted Google
  # queries, searches them through SerpAPI or Google Custom Search, and feeds
  # the ATS results into the normal matcher/digest.
  #
  # Credentials (set in .env):
  #   SERPAPI_KEY=...                      (preferred)
  #   or GOOGLE_API_KEY=... + GOOGLE_CSE_ID=...
  google:
    enabled: true
    # ATS results kept across all runs, and how many result pages per run.
    limit: 20
    pages: 2
    # Fetch each public ATS page so scoring sees the full description.
    enrich: true
    enrichLimit: 20
    # Query defaults come from profile.yaml. Override any of them here:
    # roles:
    #   - software engineer
    # location: "Remote"
    posted: d1
    # Google country code: us, in, gb, ...
    country: us
    # If Google drops the site: filter, retry these many boards one by one.
    siteQueries: 4
    # Also search Google Jobs for roles outside the ATS boards.
    jobs: true
    jobsLimit: 10
    # jobsLocation: India
    # jobsQuery: junior software engineer remote
    # level: entry
    # setup: remote
    boards: core
    # variants: false
    # sponsored: true

  # ---------------------------------------------------------------------------
  # New sources (schema added in Ticket 03; modules land in Tickets 07-23,
  # except the two newsletter feeds, which have no ticket yet)
  #
  # Every field is optional; missing values fall back to the defaults in
  # `src/sources/config.ts`. Unknown ids and malformed values only warn.
  # ---------------------------------------------------------------------------

  # Tier 1 - public job-board APIs.
  wellfound:
    enabled: true
    limit: 100
    # Optional key for a higher API quota.
    # apiKey: ${WELLFOUND_API_KEY}
    categories: [engineering, product, design]

  otta:
    enabled: true
    limit: 100
    # Otta has no public search API, so this resolves the last N job ids from
    # its sitemap (default: limit * 2, capped at 400).
    # scanLimit: 200
    # Optional filters (salaryMin uses the top of the posted range):
    # salaryMin: 0
    # location: Remote

  workatastartup:
    enabled: true
    limit: 100

  himalayas:
    enabled: true
    limit: 100
    remoteOnly: true

  # Tier 2 - RSS/Atom feeds.
  weworkremotely:
    enabled: true
    limit: 100
    # Programming-category feed. Non-tech titles are filtered out even when
    # this points at the all-jobs feed.
    feedUrl: https://weworkremotely.com/categories/remote-programming-jobs.rss

  remoteco:
    enabled: true
    limit: 100
    feedUrl: https://remote.co/remote-jobs/feed/

  jobspresso:
    enabled: true
    limit: 100
    feedUrl: "https://jobspresso.co/?feed=job_feed"

  tldr_jobs:
    enabled: true
    limit: 50
    feedUrl: https://tldr.tech/jobs/rss

  # Newsletter feeds: no stable public feed URL yet, so they stay off until a
  # source ticket fills one in.
  bytebytego:
    enabled: false
    limit: 50
    # feedUrl: https://bytebytego.com/jobs/rss

  indiehackers:
    enabled: false
    limit: 50
    # feedUrl: https://www.indiehackers.com/jobs/feed

  # Tier 3 - niche and specialized boards.
  ai_jobs_net:
    enabled: true
    limit: 60

  climatebase:
    enabled: true
    limit: 60

  web3_career:
    enabled: true
    limit: 60

  devrel_careers:
    enabled: true
    limit: 60

  # India-focused boards. Both need HTML scraping, so they are opt-in.
  naukri:
    enabled: false
    limit: 100
    categories: [it-software, engineering]

  cutshort:
    enabled: false
    limit: 60

  # Company career-page aggregators. Opt-in per run: add the company slugs you
  # care about under `companies`.
  greenhouse:
    enabled: false
    limit: 50
    companies: [stripe, airtable, notion]

  lever:
    enabled: false
    limit: 50
    companies: []

  ashby:
    enabled: false
    limit: 50
    companies: []
