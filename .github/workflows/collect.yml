# Runs a full collection + ranking pass twice a day, at 08:00 and 20:00 IST.
#
# This is the freshness job described in Ticket 24. The email bot (bot.yml)
# sends the digest, but its daily snapshot is cached per day; this workflow
# exercises the free sources on a fixed cadence so a broken board shows up
# in the source health metrics and the run logs before the next digest.
#
# Board Scan (the `google` source) is deliberately NOT part of this pass: it is
# the only quota-limited source, and its one run per day belongs to the digest
# in bot.yml. This workflow therefore does not forward SERPAPI_KEY / GOOGLE_*
# and `google` skips, while every other source still runs.
#
# Hub sync is optional:
#   HUB_URL, HUB_API_KEY

name: jobfinder collect

on:
  schedule:
    # Twice a day: 08:00 and 20:00 IST (02:30 and 14:30 UTC).
    - cron: "30 2,14 * * *"
  workflow_dispatch: {}

concurrency:
  # A collection pass is read-mostly; never let two overlap.
  group: jobfinder-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Collect and rank the free sources
        env:
          # Makes the digest date and freshness gate use IST, like the bot.
          TZ: Asia/Kolkata
          # No SERPAPI_KEY / GOOGLE_* here on purpose: Board Scan is the only
          # quota-limited source, so its one run per day belongs to the digest
          # in bot.yml. Without the keys `google` skips and the free sources run.
          # Empty when the secret is absent, so Hub sync simply stays off.
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_API_KEY: ${{ secrets.HUB_API_KEY }}
          # One JSON line per metric sample, so the run log doubles as a
          # source-health record (see docs/observability.md).
          METRICS_LOG: "1"
        # `--all` ignores the cross-run seen store so the run always shows what
        # the sources return, not just roles that are new since yesterday.
        run: npm run match -- --all --limit 25
